name: Quality and security checks

on:
  push:
    branches: ["main", "quality-security-hardening"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Install temporary browser-test dependency
        run: npm install --no-save --no-package-lock playwright@1.56.1 esbuild @vue/compiler-sfc svelte

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser and export regression tests
        run: node tests/browser-smoke.mjs
