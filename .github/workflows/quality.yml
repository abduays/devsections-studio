name: Quality and security checks

on:
  push:
    branches: ["main", "quality-security-hardening"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install temporary browser-test dependency
        run: npm install --no-save --no-package-lock playwright@1.56.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser and export regression tests
        run: node tests/browser-smoke.mjs
