name: Quality and security checks

on:
  push:
    branches: ["main", "quality-security-hardening", "release-verification-complete"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-quality:
    name: Browser regression (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Install temporary browser-test dependencies
        run: npm install --no-save --no-package-lock playwright@1.56.1 esbuild @vue/compiler-sfc svelte axe-core

      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run browser and framework export checks
        env:
          BROWSER: ${{ matrix.browser }}
          SKIP_FRAMEWORK_BUILDS: ${{ matrix.browser != 'chromium' && '1' || '0' }}
        run: node tests/browser-smoke.mjs
